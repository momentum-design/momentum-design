name: Pull Request CI
run-name: ${{ github.actor }} is running Pull Request CI

on:
  pull_request_target:
    branches:
      - main
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:

env:
  rid: ${{ github.run_id }}-${{ github.run_number }}

jobs:
  configure-labels:
    name: Configure Labels and Core Team Review
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/labeler@v6
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          configuration-path: .github/labeler.yml
          sync-labels: true
      - name: Add Core Team Label for Core Team Members Review
        if: >
          github.event.requested_team != null &&
          github.event.requested_team.slug == 'momentum-design-engineers'
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels \
            -d '{"labels":["Author: Core Team"]}'

  validate-title:
    name: Validate Pull Request Title
    runs-on: ubuntu-latest

    steps:
      - name: Check Pull Request Title
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          REGEX="^(feat|docs|chore|fix|refactor|test|style|perf|revert|build|ci)(\(\w+\))?:.+$"

          echo "PR Title: $TITLE"

          if [[ "$TITLE" =~ $REGEX ]]
          then
            echo "✅ Pull request title is valid."
            exit 0
          else
            echo "❌ Title must follow semantic commit message format. \\nPlease use one of the following to start the title with: \`feat\`,\`docs\`,\`chore\`,\`fix\`,\`refactor\`,\`test\`,\`style\`,\`perf\`,\`revert\`,\`build\`,\`ci\`"
            exit 1
          fi

  validate-description:
    name: Validate Pull Request Description
    needs: validate-title
    runs-on: ubuntu-latest

    steps:
      - name: Check Pull Request Description
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: |
          DESCRIPTION="$(echo $PR_BODY | xargs -0)"

          echo "PR Description: $DESCRIPTION"
          
          if [[ -z $DESCRIPTION ]];
          then
            echo '❌ Description matters and should not be empty. Provide detail with what was changed, why it was changed and how it will impact our consumers.'
            exit 1
          else
            echo '✅ Pull request description is valid.'
            exit 0
          fi

  validate-action:
    name: Validate Action
    needs: validate-description
    runs-on: ubuntu-latest

    steps:
      - name: Validate Labels
        run: |
          HEAD_REPO=${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO=${{ github.event.pull_request.base.repo.full_name }}
          FROM_BASE=0; [ "$HEAD_REPO" == "$BASE_REPO" ] && FROM_BASE=1

          HAS_VALIDATED_LABEL=${{ contains(github.event.pull_request.labels.*.name, 'validated') || contains(github.event.workflow_run.labels.*.name, 'validated') || contains(github.event.label.name, 'validated') }}
          VALIDATED=0; [ "$HAS_VALIDATED_LABEL" == "true" ] && VALIDATED=1

          echo github.event
          
          echo from base $FROM_BASE
          echo validated $VALIDATED

          if [[ $FROM_BASE == 1 || $VALIDATED == 1 ]]
          then
            echo 'Pull request is validated, continuing.'
            exit 0
          else
            echo 'Pull request is not validated, exiting. To validate, add the "validated" label or reach out to the Core Team and re-run the workflow.'
            exit 1
          fi

  initialize:
    name: Initialize
    needs: validate-action
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'
          
      - name: Validate Dependencies
        id: validate-dependencies
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            packages/**/node_modules
          key: node-modules-${{ hashFiles('**/yarn.lock') }}

      - name: Install Dependencies
        run: yarn

      - name: Cache Dependencies
        uses: actions/cache@v5
        if: steps.validate-dependencies.outputs.cache-hit != 'true'
        with:
          path: |
            node_modules
            packages/**/node_modules
          key: node-modules-${{ hashFiles('**/yarn.lock') }}

  generate-package-matrix:
    name: Generate Package Matrix
    needs: initialize
    runs-on: ubuntu-latest

    outputs:
      packages: ${{ steps.generate-package-matrix.outputs.packages }}
      postbuild-packages: ${{ steps.generate-package-matrix.outputs.postbuild-packages }}
      run-e2e: ${{ steps.generate-package-matrix.outputs.run-e2e }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'
          
      - name: Uncache Dependencies
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            packages/**/node_modules
          key: node-modules-${{ hashFiles('**/yarn.lock') }}

      - name: Synchronize Packages
        run: yarn
         
      - name: Update Main Branch
        run: |
          git fetch origin main --unshallow

      # Build Automation Tooling (Telemetry as precondition)
      - name: Build Automation Tooling
        run: yarn telemetry build && yarn automation build:cli

      # The components e2e tests run sharded in the `test-e2e-components` job, so the generic
      # `test-postbuild` matrix excludes that package.
      - id: generate-package-matrix
        name: Generate Package Matrix
        run: |
          packages=$(yarn md-automation -- --command get-packages --changed ${{ github.event.pull_request.base.sha }} --dependent)
          echo "packages=$packages" >> $GITHUB_OUTPUT
          echo "postbuild-packages=$(echo "$packages" | jq -c 'map(select(. != "@momentum-design/components"))')" >> $GITHUB_OUTPUT
          echo "run-e2e=$(echo "$packages" | jq -c 'index("@momentum-design/components") != null')" >> $GITHUB_OUTPUT

      - name: Display Package Matrix
        run: |
          echo "generated package matrix - ${{ steps.generate-package-matrix.outputs.packages }}"
          echo "postbuild package matrix - ${{ steps.generate-package-matrix.outputs.postbuild-packages }}"
          echo "run components e2e - ${{ steps.generate-package-matrix.outputs.run-e2e }}"

  build:
    name: Build
    needs: initialize
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'
          
      - name: Uncache Dependencies
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            packages/**/node_modules
          key: node-modules-${{ hashFiles('**/yarn.lock') }}

      - name: Synchronize Packages
        run: yarn

      - name: Build
        run: yarn build
        env:
          MOMENTUM_METRICS_API_KEY: ${{ secrets.MOMENTUM_METRICS_API_KEY }}

      - name: Upload Dist
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ env.rid }}
          path: '**/dist'
          retention-days: 1

  analyze-root:
    name: Analyze Root
    needs: initialize
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'
          
      - name: Uncache Dependencies
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            packages/**/node_modules
          key: node-modules-${{ hashFiles('**/yarn.lock') }}

      - name: Synchronize Packages
        run: yarn

      - name: Analyze
        run: yarn analyze:root

  analyze-prebuild:
    name: ( ${{ matrix.package }} / ${{ matrix.os }} ) Analyze - Prebuild
    needs: [analyze-root, generate-package-matrix, build]
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        package: ${{ fromJson(needs.generate-package-matrix.outputs.packages) }}
    
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'
          
      - name: Uncache Dependencies
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            packages/**/node_modules
          key: node-modules-${{ hashFiles('**/yarn.lock') }}

      - name: Download Dist
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ env.rid }}
          path: .

      - name: Synchronize Packages
        run: yarn

      - name: Analyze - Prebuild
        run: yarn workspace ${{ matrix.package }} analyze:prebuild

  test-prebuild:
    name: ( ${{ matrix.package }} / ${{ matrix.os }} ) Test - Prebuild
    needs: [analyze-root, generate-package-matrix, build]
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        package: ${{ fromJson(needs.generate-package-matrix.outputs.packages) }}
    
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'
          
      - name: Uncache Dependencies
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            packages/**/node_modules
          key: node-modules-${{ hashFiles('**/yarn.lock') }}
      
      - name: Download Dist
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ env.rid }}
          path: .

      - name: Synchronize Packages
        run: yarn

      - name: Test - Prebuild
        run: yarn workspace ${{ matrix.package }} test:prebuild

  analyze-postbuild:
    name: ( ${{ matrix.package }} / ${{ matrix.os }} ) Analyze - Postbuild
    needs: [analyze-root, generate-package-matrix, build]
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        package: ${{ fromJson(needs.generate-package-matrix.outputs.packages) }}
    
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'
          
      - name: Uncache Dependencies
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            packages/**/node_modules
          key: node-modules-${{ hashFiles('**/yarn.lock') }}

      - name: Download Dist
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ env.rid }}
          path: .

      - name: Synchronize Packages
        run: yarn

      - name: Analyze - Postbuild
        run: yarn workspace ${{ matrix.package }} analyze:postbuild

  test-postbuild:
    name: ( ${{ matrix.package }} / ${{ matrix.os }} ) Test - Postbuild
    needs: [analyze-root, generate-package-matrix, build]
    if: ${{ needs.generate-package-matrix.outputs.postbuild-packages != '[]' }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        package: ${{ fromJson(needs.generate-package-matrix.outputs.postbuild-packages) }}
    
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'
          
      - name: Uncache Dependencies
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            packages/**/node_modules
          key: node-modules-${{ hashFiles('**/yarn.lock') }}

      - name: Download Dist
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ env.rid }}
          path: .

      - name: Debug dist
        run: |
          pkg_name=${{ matrix.package }}
          ls -R packages/$(basename $pkg_name)/dist || echo "Dist is missing!"

      - name: Synchronize Packages
        run: yarn

      - name: Test - Postbuild
        run: yarn workspace ${{ matrix.package }} test:postbuild  

  # The components e2e suite (4 browsers x 395 tests) takes ~34 min on a single runner, so it is
  # split into one job per browser project and shard. The shard count is part of each `shard`
  # value below (e.g. `1/2`); keep it consistent across all entries.
  test-e2e-components:
    name: ( @momentum-design/components / ${{ matrix.project }} ${{ matrix.shard }} ) Test - E2E
    needs: [analyze-root, generate-package-matrix, build]
    if: ${{ needs.generate-package-matrix.outputs.run-e2e == 'true' }}
    runs-on: ubuntu-latest
    # Safety net: previously this job could hang silently for hours (see "Stop Playwright Docker
    # Browser Server" step below for the real fix) and would only ever be stopped by GitHub's
    # default 6h job timeout. Fail fast instead so a regression is visible quickly.
    timeout-minutes: 30

    strategy:
      # Let every shard finish so the merged report contains all failures.
      fail-fast: false
      matrix:
        project: [chrome, msedge, firefox, webkit]
        shard: ['1/2', '2/2']

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Uncache Dependencies
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            packages/**/node_modules
          key: node-modules-${{ hashFiles('**/yarn.lock') }}

      - name: Download Dist
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ env.rid }}
          path: .

      - name: Synchronize Packages
        run: yarn

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Playwright browser-server container is started/stopped as an explicit step here
      # rather than being managed by Playwright's own `webServer` lifecycle hooks (see
      # playwright.docker.config.ts). Previously Playwright owned starting AND stopping the
      # container; shutting it down after the run could hang indefinitely with no error/timeout,
      # so the job silently ran for hours until GitHub's default 6h job timeout killed it.
      # Decoupling the container lifecycle from the test process means Playwright never has to
      # reap it, and the "Stop" step below (which always runs, and is itself bounded by a
      # `docker stop --time` grace period) guarantees cleanup regardless of test outcome.
      - name: Start Playwright Docker Browser Server
        run: |
          yarn workspace @momentum-design/components test:e2e:docker:serve:ci
          yarn workspace @momentum-design/components test:e2e:docker:wait

      - name: Test - E2E
        run: yarn workspace @momentum-design/components test:e2e:docker:shard --project=${{ matrix.project }} --shard=${{ matrix.shard }}

      - name: Stop Playwright Docker Browser Server
        if: ${{ always() }}
        run: yarn workspace @momentum-design/components test:e2e:docker:stop || docker kill mdc-pw-server || true

      # `overwrite` lets "Re-run failed jobs" replace the blob of a previous attempt, while the
      # blobs of shards that already passed stay available for the merged report.
      - name: Upload Playwright Blob Report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-blob-report-${{ strategy.job-index }}
          path: packages/components/blob-report/
          retention-days: 3
          overwrite: true

  test-e2e-components-report:
    name: ( @momentum-design/components ) Test - E2E Report
    needs: test-e2e-components
    if: ${{ !cancelled() && needs.test-e2e-components.result != 'skipped' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Uncache Dependencies
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            packages/**/node_modules
          key: node-modules-${{ hashFiles('**/yarn.lock') }}

      - name: Synchronize Packages
        run: yarn

      - name: Download Playwright Blob Reports
        uses: actions/download-artifact@v8
        with:
          pattern: playwright-blob-report-*
          path: packages/components/all-blob-reports
          merge-multiple: true

      - name: Extract Playwright Blob Reports
        run: |
          cd packages/components/all-blob-reports
          for f in *.zip; do
            if [ -f "$f" ]; then
              unzip -o "$f" -d .
              rm "$f"
            fi
          done

      - name: Verify all E2E shard blob reports are present
        run: |
          expected_blob_count=8
          actual_blob_count=$(find packages/components/all-blob-reports -name "blob-report.json" | wc -l)
          if [ "$actual_blob_count" -ne "$expected_blob_count" ]; then
            echo "::error::Expected $expected_blob_count blob reports but found $actual_blob_count. Some shards may have failed or blobs may have expired."
            exit 1
          fi
          echo "✓ All $expected_blob_count blob reports present"

      - name: Merge Playwright Reports
        run: yarn workspace @momentum-design/components test:e2e:merge-reports all-blob-reports

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: packages/components/playwright-report/
          retention-days: 30
          overwrite: true

      # `playwright merge-reports` exits 0 even when the merged tests failed, and a shard that
      # crashed or timed out never uploads a blob, so the shard job results decide the outcome.
      - name: Fail if any shard failed
        if: ${{ needs.test-e2e-components.result != 'success' }}
        run: |
          echo "::error::Components e2e shards finished with result '${{ needs.test-e2e-components.result }}'"
          exit 1
